<!DOCTYPE html>
<html>
<head>
  <title>Food Business Academy - Student Login</title>

  <!-- Firebase COMPAT SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; background:#f9f9f9; display:flex; justify-content:center; align-items:center; height:100vh; }
    .login-container { max-width:400px; width:100%; padding:30px; background:#fff; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
    input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; }
    button { width:100%; padding:12px; border:none; border-radius:6px; font-size:16px; cursor:pointer; }
    #loginBtn { background:#0074D9; color:white; margin-bottom:10px; }
    #signupBtn { background:#8A2BE2; color:white; }
    #message { margin-top:15px; text-align:center; color:red; }
  </style>
</head>
<body>

<div class="login-container">
  <h2 style="text-align:center;">Student Login</h2>
  <input id="username" type="text" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  
  <button id="loginBtn" onclick="login()">Login</button>
  <button id="signupBtn" onclick="signUp()">Sign Up</button>

  <p id="message"></p>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBAx6F9q-jBoKAGV_UNNVZj1_1f8ccVu98",
    authDomain: "foodbusinessacademy-f1c60.firebaseapp.com",
    projectId: "foodbusinessacademy-f1c60",
    storageBucket: "foodbusinessacademy-f1c60.firebasestorage.app",
    messagingSenderId: "676124097300",
    appId: "1:676124097300:web:e9949d6dfa21ff214de001",
    measurementId: "G-D1JSR13KVE"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  window.onload = function() {
    const message = document.getElementById("message");

    async function signUp() {
      const username = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!username || !pass) {
        message.style.color = "red";
        message.innerText = "Please enter username and password.";
        return;
      }

      const email = username + "@students.com";

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
        const uid = userCredential.user.uid;

        await db.collection("Students Login").doc(uid).set({
          username: username,
          progress: 0,
          createdAt: new Date()
        });

        message.style.color = "green";
        message.innerText = "Account created! You may now login.";
      } catch (error) {
        message.style.color = "red";
        message.innerText = error.message;
      }
    }

    async function login() {
      const username = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!username || !pass) {
        message.style.color = "red";
        message.innerText = "Please enter username and password.";
        return;
      }

      const email = username + "@students.com";

      try {
        await auth.signInWithEmailAndPassword(email, pass);
        window.location.href = "https://foodbusinessacademdy.blogspot.com/p/welcome-jason.html";
      } catch (error) {
        message.style.color = "red";
        message.innerText = error.message;
      }
    }

    window.signUp = signUp;
    window.login = login;
  };
</script>

</body>
</html>
